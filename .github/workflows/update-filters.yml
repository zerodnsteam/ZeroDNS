name: Daily Update AdGuard DNS Filter

on:
  schedule:
    # KST 자정 (UTC 15:00)에 실행
    - cron: '0 15 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-update-adguard-dns-filter
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Build and update AdGuard DNS filter
        shell: bash
        run: |
          set -euo pipefail

          # 1) 원본 필터 소스 목록
          sources=(
            "oisd-big|https://raw.githubusercontent.com/cbuijs/oisd/refs/heads/master/big/domains.top-n.adblock"
            "ultimate-mini|https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/ultimate-mini/domains.top-n.adblock"
            "tif-mini|https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/tif-mini/domains.top-n.adblock"
            "popupads|https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/popupads/domains.top-n.adblock"
          )

          # 2) 병합·정제·중복 제거
          tmpfile=$(mktemp)
          {
            for entry in "${sources[@]}"; do
              url="${entry#*|}"
              curl -fsSL --retry 3 --retry-delay 5 "$url" || true
            done
          } | grep -v '^!' \
            | sed -E 's#^\|\|##; s#\^$##' \
            | grep -E '^[A-Za-z0-9.-]+$' \
            | sort -u \
            > "$tmpfile"

          # 3) 변화 없으면 종료
          if [ -f ZeroDNS-AdGuard-DNS-Filter.txt ]; then
            grep '^||' ZeroDNS-AdGuard-DNS-Filter.txt \
              | sed -E 's#^\|\|##; s#\^$##' \
              > old_domains
            if diff -q old_domains "$tmpfile"; then
              echo "No changes in domains; exiting"
              exit 0
            fi
          fi

          # 4) 최종 필터 파일 생성
          version=$(TZ=Asia/Seoul date +'%Y%m%d')
          updated=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S %Z')
          output=ZeroDNS-AdGuard-DNS-Filter.txt

          cat > "$output" <<EOF
! Title: ZeroDNS AdGuard DNS Filter
! Description: Daily merged top-n domain blocklist from oisd big, ultimate-mini, tif-mini, popupads
! Version: $version
! Updated: $updated

EOF

          for entry in "${sources[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            echo "! Source: $name ($url)" >> "$output"
          done
          echo "" >> "$output"

          sed -E 's#^\|\|##; s#\^$##' "$tmpfile" \
            | sed 's#^#||#; s#$#^#' \
            >> "$output"

          # 5) 변경 시 커밋 & 푸시
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$output"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily update AdGuard DNS filter v$version"
          git push
