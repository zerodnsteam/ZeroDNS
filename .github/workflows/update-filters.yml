name: Daily Update AdGuard DNS Filter

on:
  schedule:
    # KST 자정 (UTC 15:00)에 실행
    - cron: '0 15 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-update-adguard-dns-filter
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # 한 번만 선언해서 아래 모든 스텝에서 사용
      SOURCES: |
        oisd-big|https://raw.githubusercontent.com/cbuijs/oisd/refs/heads/master/big/domains.top-n.adblock
        ultimate-mini|https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/ultimate-mini/domains.top-n.adblock
        tif-mini|https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/tif-mini/domains.top-n.adblock
        popupads|https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/popupads/domains.top-n.adblock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Merge and dedupe domains
        shell: bash
        run: |
          set -euo pipefail
          # 환경변수에서 배열로 변환
          IFS=$'\n' read -r -d '' -a sources <<< "$SOURCES"$'\0'
          {
            for entry in "${sources[@]}"; do
              url=${entry#*|}
              curl -fsSL --retry 3 --retry-delay 5 "$url" || true
            done
          } | grep -v '^!' \
            | sed -E 's#^\|\|##; s#\^$##' \
            | grep -E '^[A-Za-z0-9.-]+$' \
            | sort -u \
            > domains.tmp

      - name: Check for domain changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ZeroDNS-AdGuard-DNS-Filter.txt ]; then
            grep '^||' ZeroDNS-AdGuard-DNS-Filter.txt \
              | sed -E 's#^\|\|##; s#\^$##' \
              > old-domains.tmp
            if diff -q old-domains.tmp domains.tmp; then
              echo "No domain changes; exiting"
              exit 0
            fi
          fi

      - name: Build final filter file
        shell: bash
        run: |
          set -euo pipefail
          version=$(TZ=Asia/Seoul date +'%Y%m%d')
          updated=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S %Z')
          output="ZeroDNS-AdGuard-DNS-Filter.txt"

          # 헤더
          echo "! Title: ZeroDNS AdGuard DNS Filter" > "$output"
          echo "! Description: Daily merged top-n domain blocklist" >> "$output"
          echo "! Version: $version" >> "$output"
          echo "! Updated: $updated" >> "$output"
          echo "" >> "$output"

          # 소스 주석
          while IFS= read -r entry; do
            name=${entry%%|*}
            url=${entry#*|}
            echo "! Source: $name ($url)" >> "$output"
          done <<< "$SOURCES"
          echo "" >> "$output"

          # 도메인 필터 본문
          sed -E 's#^\|\|##; s#\^$##' domains.tmp \
            | sed 's#^#||#; s#$#^#' \
            >> "$output"

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version=$(TZ=Asia/Seoul date +'%Y%m%d')
          git add ZeroDNS-AdGuard-DNS-Filter.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily update AdGuard DNS filter v$version"
          git push
