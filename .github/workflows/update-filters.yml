name: Daily Update DNS Filters

on:
  schedule:
    # KST 자정(UTC 15:00)에 실행
    - cron: '0 15 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-update-dns-filters
  cancel-in-progress: true

jobs:
  merge-and-commit:
    runs-on: ubuntu-latest
    steps:
      # 1. 체크아웃 (푸시 권한 유지)
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      # 2. 병합·중복제거·AdGuard DNS 포맷
      - name: Merge, dedupe & format for AdGuard DNS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/cbuijs/oisd/refs/heads/master/big/domains.top-n.adblock \
            https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/ultimate-mini/domains.top-n.adblock \
            https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/tif-mini/domains.top-n.adblock \
            https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/popupads/domains.top-n.adblock \
          || true \
          | grep -v '^!' \
          | sed -E 's#^\|\|##; s#\^$##' \
          | grep -E '^[A-Za-z0-9.-]+$' \
          | sort -u \
          | sed 's#^#||#; s#$#^#' \
          > domains.top-n.adguard-dns

      # 3. 파일 존재 체크 후 커밋 & 푸시
      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f domains.top-n.adguard-dns ]; then
            echo "domains.top-n.adguard-dns not found, skipping commit"
            exit 0
          fi

          git add domains.top-n.adguard-dns

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: daily update merged DNS filters for AdGuard DNS"
          git push
